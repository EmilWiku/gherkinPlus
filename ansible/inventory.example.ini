[pocketoption_servers]
# Copy to inventory.ini (gitignored) and set your host. Prefer SSH keys over passwords.
pocketoption_server ansible_host=YOUR_SERVER_IP ansible_user=root ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# ansible_password=...   # optional if not using SSH keys

[pocketoption_servers:vars]
ansible_python_interpreter=/usr/bin/python3
